<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨角獸創作樂園</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f3e7e9 0%, #e3eeff 100%); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #ff6b81; margin-bottom: 25px; }
        .section { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; background: #fafafa; }
        button { width: 100%; background: #ff6b81; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #ff4757; }
        #result { margin-top: 25px; text-align: center; }
        #result img { max-width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; margin-top: 15px; }
        .loading { display: none; color: #ff6b81; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦄 獨角獸創作樂園 🌟</h1>
        
        <div class="section">
            <label for="feather">1. 選擇獨角獸的羽毛樣式：</label>
            <select id="feather">
                <option value="crystal glowing wings">水晶發光羽毛</option>
                <option value="rainbow gradient feathered wings">彩虹漸層羽毛</option>
                <option value="golden stellar wings">金色星辰羽毛</option>
                <option value="angelic white feathered wings">純白天使羽毛</option>
                <option value="galaxy starlight wings">銀河星光羽毛</option>
                <option value="rose quartz crystal wings">粉晶寶石羽毛</option>
                <option value="midnight shadow purple wings">午夜紫魅羽毛</option>
                <option value="peacock gemstone majestic wings">孔雀寶石羽毛</option>
            </select>
        </div>

        <div class="section">
            <label for="color">2. 選擇獨角獸的毛色與鬃毛：</label>
            <select id="color">
                <option value="pearl white body with pastel pink and blue mane">珍珠白身體、粉藍漸層鬃毛</option>
                <option value="lavender purple body with silver mane">薰衣草紫身體、銀色鬃毛</option>
                <option value="midnight blue body with glowing cyan mane">午夜藍身體、發光青綠鬃毛</option>
                <option value="golden champagne body with golden mane">香檳金身體、金色鬃毛</option>
                <option value="soft mint green body with white mane">薄荷綠身體、純白鬃毛</option>
                <option value="rose pink body with white and gold mane">玫瑰粉身體、白金鬃毛</option>
                <option value="silver grey body with rainbow mane">銀灰色身體、彩虹色鬃毛</option>
                <option value="sunset peach body with orange and yellow mane">夕陽橘桃紅身體、橘黃鬃毛</option>
            </select>
        </div>

        <div class="section">
            <label for="background">3. 選擇背景場景：</label>
            <select id="background">
                <option value="magical enchanted forest at night with glowing mushrooms and full moon">神祕魔法森林（夜間、發光蘑菇與滿月）</option>
                <option value="dreamy pink cloud sky with floating islands and rainbows">夢幻粉紅雲端天空（浮空島與彩虹）</option>
                <option value="starlit galaxy nebula space background">璀璨銀河星雲宇宙背景</option>
                <option value="crystal ice palace with aurora borealis">極光水晶冰晶宮殿</option>
                <option value="sunlit flower meadow with butterflies">陽光灑落的百花草地與蝴蝶</option>
                <option value="underwater magical coral reef ocean">神祕海底奇幻珊瑚礁</option>
                <option value="autumn maple forest with falling golden leaves">秋日楓紅落葉森林</option>
                <option value="ancient castle garden at sunset">日落時分的古堡花園</option>
            </select>
        </div>

        <button onclick="generateUnicorn()">✨ 開始生成專屬獨角獸！</button>

        <div id="result">
            <div class="loading" id="loadingText">🎨 獨角獸正在施展魔法誕生中，請稍候 3-5 秒...</div>
            <img id="unicornImage" alt="生成的獨角獸圖片" onload="hideLoading()" onerror="showError()">
            <div id="errorText" style="color: red; display: none; margin-top: 10px;">圖片生成發生了一點小狀況，請再點一次按鈕試試看！</div>
        </div>
    </div>

    <script>
        function generateUnicorn() {
            const feather = document.getElementById('feather').value;
            const color = document.getElementById('color').value;
            const background = document.getElementById('background').value;

            const img = document.getElementById('unicornImage');
            const loading = document.getElementById('loadingText');
            const error = document.getElementById('errorText');

            img.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';

            const prompt = `cute magical unicorn with ${feather}, ${color}, standing in ${background}, digital art, beautiful lighting, children storybook illustration style, highly detailed`;
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;
            
            img.src = imageUrl;
        }

        function hideLoading() {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('unicornImage').style.display = 'block';
        }

        function showError() {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('errorText').style.display = 'block';
        }
    </script>
</body>
</html>
