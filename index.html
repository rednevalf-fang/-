<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢幻魔法卡片 - 獨角獸創作樂園</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a102f 0%, #2b1b4e 50%, #4a2858 100%);
            margin: 0;
            padding: 20px;
            color: #f0e6ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(30, 20, 50, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 182, 255, 0.2);
        }
        h1 {
            text-align: center;
            color: #ff9ecd;
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(255, 158, 205, 0.5);
        }
        .section {
            margin-bottom: 18px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #d8b4fe;
            font-size: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #6b46c1;
            font-size: 15px;
            background: #2d1b4e;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }
        select:focus {
            border-color: #ff9ecd;
            box-shadow: 0 0 8px rgba(255, 158, 205, 0.4);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }
        button:hover {
            background: linear-gradient(135deg, #ff5270 0%, #ff629a 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 117, 140, 0.6);
        }
        #result {
            margin-top: 25px;
            text-align: center;
            background: rgba(15, 10, 30, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px dashed rgba(255, 182, 255, 0.3);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .unicorn-icon {
            font-size: 48px;
            margin-bottom: 10px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        #result img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: none;
        }
        .loading {
            display: none;
            color: #ff9ecd;
            font-weight: bold;
            font-size: 16px;
        }
        .placeholder-text {
            color: #b794f4;
            font-size: 14px;
            line-height: 1.6;
        }
        .error-box {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid #ff5050;
            color: #ff9e9e;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 夢幻魔法卡片：獨角獸創作樂園 🦄</h1>
        
        <div class="section">
            <label for="feather">1. 選擇獨角獸的羽毛樣式：</label>
            <select id="feather">
                <option value="crystal glowing wings">水晶發光羽毛</option>
                <option value="rainbow gradient feathered wings">彩虹漸層羽毛</option>
                <option value="golden stellar wings">金色星辰羽毛</option>
                <option value="angelic white feathered wings">純白天使羽毛</option>
                <option value="galaxy starlight wings">銀河星光羽毛</option>
                <option value="rose quartz crystal wings">粉晶寶石羽毛</option>
                <option value="midnight shadow purple wings">午夜紫魅羽毛</option>
                <option value="peacock gemstone majestic wings">孔雀寶石羽毛</option>
            </select>
        </div>

        <div class="section">
            <label for="color">2. 選擇獨角獸的毛色與鬃毛：</label>
            <select id="color">
                <option value="pearl white body with pastel pink and blue mane">珍珠白身體、粉藍漸層鬃毛</option>
                <option value="lavender purple body with silver mane">薰衣草紫身體、銀色鬃毛</option>
                <option value="midnight blue body with glowing cyan mane">午夜藍身體、發光青綠鬃毛</option>
                <option value="golden champagne body with golden mane">香檳金身體、金色鬃毛</option>
                <option value="soft mint green body with white mane">薄荷綠身體、純白鬃毛</option>
                <option value="rose pink body with white and gold mane">玫瑰粉身體、白金鬃毛</option>
                <option value="silver grey body with rainbow mane">銀灰色身體、彩虹色鬃毛</option>
                <option value="sunset peach body with orange and yellow mane">夕陽橘桃紅身體、橘黃鬃毛</option>
            </select>
        </div>

        <div class="section">
            <label for="background">3. 選擇背景場景：</label>
            <select id="background">
                <option value="magical enchanted forest at night with glowing mushrooms and full moon">神祕魔法森林（夜間、發光蘑菇與滿月）</option>
                <option value="dreamy pink cloud sky with floating islands and rainbows">夢幻粉紅雲端天空（浮空島與彩虹）</option>
                <option value="starlit galaxy nebula space background">璀璨銀河星雲宇宙背景</option>
                <option value="crystal ice palace with aurora borealis">極光水晶冰晶宮殿</option>
                <option value="sunlit flower meadow with butterflies">陽光灑落的百花草地與蝴蝶</option>
                <option value="underwater magical coral reef ocean">神祕海底奇幻珊瑚礁</option>
                <option value="autumn maple forest with falling golden leaves">秋日楓紅落葉森林</option>
                <option value="ancient castle garden at sunset">日落時分的古堡花園</option>
            </select>
        </div>

        <button onclick="generateUnicorn()">✨ 開始召喚魔法獨角獸！</button>

        <div id="result">
            <div id="placeholderContent">
                <div class="unicorn-icon">🦄</div>
                <div class="placeholder-text">魔法陣準備就緒<br>請在上方選擇你喜歡的羽毛、毛色與背景，然後點擊「開始召喚」來創造專屬獨角獸！</div>
            </div>
            <div class="loading" id="loadingText">🎨 獨角獸正在魔法陣中誕生中，請稍候 3-5 秒...</div>
            <img id="unicornImage" alt="生成的獨角獸圖片" onload="hideLoading()" onerror="showError()">
            <div class="error-box" id="errorText">⚠️ 魔法施展遇到了一點小阻礙，請再點一次按鈕試試看！</div>
        </div>
    </div>

    <script>
        function generateUnicorn() {
            const feather = document.getElementById('feather').value;
            const color = document.getElementById('color').value;
            const background = document.getElementById('background').value;

            const placeholder = document.getElementById('placeholderContent');
            const img = document.getElementById('unicornImage');
            const loading = document.getElementById('loadingText');
            const error = document.getElementById('errorText');

            placeholder.style.display = 'none';
            img.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';

            const prompt = `cute magical unicorn with ${feather}, ${color}, standing in ${background}, digital art, beautiful lighting, children storybook illustration style, highly detailed`;
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;
            
            img.src = imageUrl;
        }

        function hideLoading() {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('unicornImage').style.display = 'block';
        }

        function showError() {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('errorText').style.display = 'block';
            document.getElementById('placeholderContent').style.display = 'block';
        }
    </script>
</body>
</html>
